networks:
  default:
    name: "homelab_base_default"
    external: true

services:
  grocy:
    image: linuxserver/grocy
    environment:
      PUID: "${UID}"
      PGID: "${GID}"
      TZ: "${TIMEZONE}"
    volumes:
      - ./data/grocy/config:/config
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.grocy.loadbalancer.server.port=80"
      - "traefik.http.routers.grocy.rule=Host(`grocy.${DOMAIN_NAME}`)"
      - "traefik.http.routers.grocy.entrypoints=web-secure"
      - "traefik.http.routers.grocy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grocy.middlewares=authelia@docker"
